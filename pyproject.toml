[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foundrysdk"
version = "0.1.0"
description = "Modding toolkit for Foundry Of Gods"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

dependencies = [
    "PySide6>=6.8,<7"
]

[project.scripts]
foundrysdk = "foundrysdk.application:main"